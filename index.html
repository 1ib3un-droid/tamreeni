<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تمريني">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>تمريني</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
  --text:#eef0f4; --muted:#9aa1ae; --accent:#3ddc97; --accent-ink:#06281a;
  --warn:#ffb547; --bad:#ff6b6b; --blue:#5aa9ff; --violet:#b48cff;
  --r:16px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f4f7; --card:#ffffff; --card2:#f0f2f5; --line:#e2e5eb;
    --text:#14171c; --muted:#646b78; --accent:#11a86a; --accent-ink:#ffffff;
    --warn:#c77700; --bad:#d64545; --blue:#1f6fd1; --violet:#7a4fd6;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:16px;line-height:1.5;
  padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 84px);}
main{max-width:640px;margin:0 auto;padding:0 14px}
h1{font-size:24px;margin:8px 2px 12px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.en{direction:ltr;unicode-bidi:isolate;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.stack>*+*{margin-top:8px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--card2);color:var(--text);cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn-block{width:100%;display:block;text-align:center}
a.btn{display:inline-block;text-align:center;text-decoration:none;color:var(--text)}
a.btn-primary{color:var(--accent-ink)}
.btn-danger{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:80px;direction:ltr;text-align:left;font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:6px 0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:13px;border:1px solid var(--line)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip.on .en{color:inherit;opacity:.8}
a.chip{text-decoration:none;color:var(--text)}
a.chip.on{color:var(--accent-ink)}
a{color:var(--blue);text-decoration:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.banner{border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid var(--line);background:var(--card2)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 12%,var(--card))}
.banner.good{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--warn)}
.macro{margin-bottom:10px}
.macro .row{font-size:14px;margin-bottom:4px}
.big{font-size:28px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.nav a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:12px;padding:4px 0}
.nav a .ic{display:block;font-size:22px;line-height:1.2}
.nav a.on{color:var(--accent);font-weight:700}
/* exercise */
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-title{font-weight:800;font-size:17px}
.ex-tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.set{display:grid;grid-template-columns:34px 64px 1fr 1fr 44px;gap:6px;align-items:center;margin-top:6px}
.set .n{color:var(--muted);text-align:center;font-weight:700}
.tag{font-size:11px;padding:3px 6px;border-radius:8px;text-align:center;cursor:pointer;border:1px solid var(--line);white-space:nowrap}
.tag.w{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.tag.n{color:var(--text)}
.tag.f{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.set input{text-align:center;padding:8px 4px}
.set .ok{padding:8px 0;background:var(--accent);color:var(--accent-ink);font-weight:800}
.logged{background:var(--card2);border-radius:10px;padding:8px 4px}
.logged .val{text-align:center;font-weight:700}
.pr{color:var(--warn);font-size:12px;font-weight:800}
.last{font-size:13px;color:var(--muted);background:var(--card2);border-radius:10px;padding:6px 10px;margin-top:6px}
.note{font-size:13px;background:color-mix(in srgb,var(--warn) 14%,var(--card));border-radius:10px;padding:6px 10px;margin-top:6px}
.done-mark{color:var(--accent);font-weight:800}
/* food */
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:600}
.list-pick{max-height:52vh;overflow:auto}
.pick{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 4px;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.modal .x{float:left;background:var(--card2);border-radius:99px;width:34px;height:34px;padding:0}
.toast-btn{margin-inline-start:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:6px 12px;border-radius:10px}
h3.grp{font-size:13px;color:var(--muted);margin:12px 4px 2px}
.toast{display:flex;align-items:center;justify-content:center;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;max-width:90vw;text-align:center}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card2)}
.cal .done{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cal .miss{background:color-mix(in srgb,var(--bad) 35%,var(--card2))}
.cal .rest{opacity:.45}
.cal .today{outline:2px solid var(--blue)}
.cal .h{color:var(--muted);font-size:11px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none}
.wd b{font-size:17px}
.wd.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wd.on span{color:inherit!important;opacity:1!important}
.wd.tdy:not(.on){border-color:var(--blue)}
svg.chart{width:100%;height:auto;display:block}
.video-wrap{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#reader{width:100%;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600;font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi>div{background:var(--card2);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.hide{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav">
  <a href="#home" data-r="home"><span class="ic">🏠</span>اليوم</a>
  <a href="#workout" data-r="workout"><span class="ic">🏋️</span>التمرين</a>
  <a href="#food" data-r="food"><span class="ic">🍽️</span>الأكل</a>
  <a href="#progress" data-r="progress"><span class="ic">📈</span>التقدم</a>
  <a href="#more" data-r="more"><span class="ic">⚙️</span>الإعدادات</a>
</nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
